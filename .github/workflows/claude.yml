    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    uses: Red-Hat-AI-Innovation-Team/.github/.github/workflows/claude-code.yml@main
